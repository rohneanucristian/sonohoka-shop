<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order confirmed — Sonohoka</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@700&family=Archivo:wght@400;500;600&display=swap');
  :root {
    --red: #E5473B; --ink: #F7F1EA; --ink-soft: #B4A69B; --paper: #141110; --line: rgba(247,241,234,0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink); font-family: 'Archivo', sans-serif; text-align: center; padding: 2rem;
  }
  .card { max-width: 480px; }
  .mark { font-size: 2.5rem; color: var(--red); margin-bottom: 0.5rem; }
  h1 { font-family: 'Zilla Slab', serif; text-transform: uppercase; font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 1rem; }
  p { color: var(--ink-soft); font-size: 1.05rem; line-height: 1.6; margin: 0 0 1.75rem; }
  a.btn {
    display: inline-block; background: var(--ink); color: var(--paper); text-decoration: none;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; font-size: 0.85rem; padding: 0.9rem 1.6rem;
  }
  a.btn:hover { background: var(--red); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">✓</div>
    <h1>Order confirmed</h1>
    <p>Thank you — your Sonohoka order is on its way. A confirmation has been sent to your email, and you'll get a note the moment it ships.</p>
    <a class="btn" href="/index.html">Back to Sonohoka</a>
  </div>
  <script>
    try { localStorage.removeItem('sonohoka_cart'); } catch (e) {}
  </script>
</body>
</html>
