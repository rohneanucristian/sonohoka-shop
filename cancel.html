<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout cancelled — Sonohoka</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@700&family=Archivo:wght@400;500;600&display=swap');
  :root {
    --red: #E5473B; --ink: #F7F1EA; --ink-soft: #B4A69B; --paper: #141110; --line: rgba(247,241,234,0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink); font-family: 'Archivo', sans-serif; text-align: center; padding: 2rem;
  }
  .card { max-width: 480px; }
  h1 { font-family: 'Zilla Slab', serif; text-transform: uppercase; font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 1rem; color: var(--red); }
  p { color: var(--ink-soft); font-size: 1.05rem; line-height: 1.6; margin: 0 0 1.75rem; }
  a.btn {
    display: inline-block; background: var(--ink); color: var(--paper); text-decoration: none;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; font-size: 0.85rem; padding: 0.9rem 1.6rem;
  }
  a.btn:hover { background: var(--red); }
</style>
</head>
<body>
  <div class="card">
    <h1>Checkout cancelled</h1>
    <p>No payment was taken. Your basket is still waiting for you whenever you're ready to finish up.</p>
    <a class="btn" href="/index.html">Back to basket</a>
  </div>
</body>
</html>
